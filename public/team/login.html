<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limelight - Sign in</title>
<link rel="icon" type="image/png" href="/img/favicon.png?v=4">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#050505">
<style>
  /* Limelight Black: true black, a hairline-edged card, Helvetica type, the logo's yellow triangle */
  :root { --bg: #050505; --panel: #0e0e10; --hair: rgba(255,255,255,.08); --text: #f7f7f8; --muted: #9b9ba1; --faint: #5f5f66; --accent: #ffc21a;
    --y-grad: linear-gradient(180deg, #ffd85a 0%, #ffc21a 60%, #f4ad00 100%); --red: #ff6369; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(800px 420px at 50% -10%, rgba(255,194,26,.09), transparent 62%), var(--bg); color: var(--text);
    font: 14.5px/1.5 "Helvetica Now Text", "Helvetica Neue", Helvetica, "Inter", Arial, "Nirmala UI", sans-serif; letter-spacing: 0; padding: 16px; position: relative; overflow: hidden; }
  /* the logo's triangle, large and faint, like a beam of light behind the card */
  body::before { content: ""; position: absolute; width: 760px; height: 760px; right: -220px; top: -260px; background: url(/img/limelight-triangle.svg) center / contain no-repeat; opacity: .05; transform: rotate(8deg); pointer-events: none; }
  form { width: min(380px, 100%); background: linear-gradient(180deg, #121214, #0d0d0f); border-radius: 18px; padding: 32px 28px 26px; display: grid; gap: 12px;
    box-shadow: 0 0 0 1px var(--hair) inset, 0 40px 100px -30px #000; }
  form { position: relative; }
  h1 { margin: 4px 0 14px; display: grid; justify-items: center; }
  h1 img { width: 230px; height: auto; display: block; }
  label { font-size: 12px; font-weight: 500; color: var(--muted); display: grid; gap: 6px; }
  input { font: inherit; color: inherit; background: #08080a; border: 0; border-radius: 10px; padding: 10px 12px; box-shadow: 0 0 0 1px var(--hair) inset; outline: none; }
  input:focus { box-shadow: 0 0 0 1px rgba(255,194,26,.6) inset, 0 0 0 3px rgba(255,194,26,.12); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px rgba(255,194,26,.6); }
  button { font: inherit; font-weight: 650; background: var(--y-grad); color: #111; border: 0; border-radius: 10px; padding: 11px; cursor: pointer; margin-top: 4px;
    box-shadow: 0 1px 0 rgba(255,255,255,.45) inset, 0 10px 24px -12px rgba(255,194,26,.8); }
  button:hover { filter: brightness(1.06); }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  .err { color: var(--red); min-height: 18px; }
  .inst { background: #17171a; color: var(--text); box-shadow: 0 0 0 1px var(--hair) inset; font-weight: 600; }
  .inst[hidden] { display: none; }
  .sc { color: var(--faint); font-size: 12px; text-align: center; text-decoration: none; } .sc:hover { color: var(--muted); }
</style>
</head>
<body>
<form id="f">
  <h1><img src="/img/limelight-logo-white.png" alt="limelight - Elevate &amp; Illuminate"></h1>
  <p>Sign in with the name and password the editor's owner gave you.</p>
  <label>Name <input id="n" autocomplete="username" required></label>
  <label>Password <input id="p" type="password" autocomplete="current-password" required></label>
  <button>Sign in</button>
  <div class="err" id="e" role="alert"></div>
  <button type="button" class="inst" id="inst" hidden>Install on this PC (Desktop icon)</button>
  <p class="sc" id="instHow">Desktop icon: in Chrome / Edge open the <b>menu</b> › <b>Cast, save and share</b> › <b>Install page as app</b> (Edge: <b>Apps › Install this site as an app</b>)</p>
</form>
<script>
// 🖥 Chrome / Edge offer to install the editor as an app: one click puts its icon on the Desktop and in the Start menu
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
let ask = null;
const inst = document.getElementById('inst'), how = document.getElementById('instHow');
if (matchMedia('(display-mode: standalone)').matches) how.hidden = true; // (already opened as the app)
addEventListener('beforeinstallprompt', (ev) => { ev.preventDefault(); ask = ev; inst.hidden = false; how.hidden = true; });
addEventListener('appinstalled', () => { inst.hidden = true; how.hidden = false; how.textContent = 'Installed - the Limelight icon is on the Desktop'; });
inst.onclick = async () => { if (!ask) return; ask.prompt(); await ask.userChoice.catch(() => null); ask = null; inst.hidden = true; };
document.getElementById('f').onsubmit = async (ev) => {
  ev.preventDefault();
  const e = document.getElementById('e'); e.textContent = '';
  const r = await fetch('/team/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: document.getElementById('n').value, password: document.getElementById('p').value }) }).catch(() => null);
  if (!r) { e.textContent = 'Cannot reach the editing computer'; return; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { e.textContent = j.error || 'Could not sign in'; return; }
  // (a project link - #/p/<name> - opens that project after signing in). On that same address already, going "there"
  // only changes the #, which loads nothing - the sign-in page stayed until a refresh. So: load the page again.
  if (location.pathname === '/') location.reload(); else location.href = `/${location.hash}`;
};
</script>
</body>
</html>
