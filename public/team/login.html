<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Limelight Editor - Sign in</title>
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#070706">
<style>
  :root { --bg: #070706; --panel: #141311; --line: #2a2620; --text: #ece9e2; --muted: #8e887d; --accent: #d4a24c; --green: #36c27e; --red: #ff5d5d; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(700px 360px at 50% 0%, #d4a24c1f, transparent 65%), var(--bg); color: var(--text); font: 15px/1.45 "Segoe UI", "Nirmala UI", system-ui, sans-serif; padding: 16px; }
  form { width: min(360px, 100%); background: var(--panel); border: 1px solid var(--line); border-top-color: #d4a24c66; box-shadow: 0 30px 80px -30px #000, 0 0 40px -20px #d4a24c66; border-radius: 12px; padding: 24px; display: grid; gap: 10px; }
  h1 { margin: 0 0 6px; display: grid; justify-items: center; gap: 10px; font: 600 20px/1 Bahnschrift, "Segoe UI", sans-serif; letter-spacing: .18em; }
  h1 img { width: 84px; height: 84px; filter: drop-shadow(0 0 14px #e8b55a66); }
  h1 em { font-style: normal; background: linear-gradient(180deg, #f6d48a, #d9a650 55%, #b5812f); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 small { font-size: 10px; letter-spacing: .5em; color: var(--accent); font-weight: 400; }
  label { font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
  input { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; font-weight: 600; background: linear-gradient(180deg, #f6d48a, #d9a650 55%, #b5812f); color: #170f03; border: 0; border-radius: 8px; padding: 10px; cursor: pointer; }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  .err { color: var(--red); min-height: 18px; }
  .inst { background: none; color: var(--accent); border: 1px solid #d4a24c66; font-weight: 600; }
  .inst[hidden] { display: none; }
  .sc { color: var(--accent); font-size: 12px; text-align: center; text-decoration: none; } .sc:hover { text-decoration: underline; }
</style>
</head>
<body>
<form id="f">
  <h1><img src="/img/limelight-icon.png" alt=""><span>LIME<em>LIGHT</em></span><small>EDITOR</small></h1>
  <p>Sign in with the name and password the editor's owner gave you.</p>
  <label>Name <input id="n" autocomplete="username" required></label>
  <label>Password <input id="p" type="password" autocomplete="current-password" required></label>
  <button>Sign in</button>
  <div class="err" id="e" role="alert"></div>
  <button type="button" class="inst" id="inst" hidden>🖥 Install on this PC (Desktop icon)</button>
  <p class="sc" id="instHow">🖥 Desktop icon: in Chrome / Edge press <b>⋮</b> › <b>Cast, save and share</b> › <b>Install page as app</b> (Edge: <b>Apps › Install this site as an app</b>)</p>
</form>
<script>
// 🖥 Chrome / Edge offer to install the editor as an app: one click puts its icon on the Desktop and in the Start menu
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
let ask = null;
const inst = document.getElementById('inst'), how = document.getElementById('instHow');
if (matchMedia('(display-mode: standalone)').matches) how.hidden = true; // (already opened as the app)
addEventListener('beforeinstallprompt', (ev) => { ev.preventDefault(); ask = ev; inst.hidden = false; how.hidden = true; });
addEventListener('appinstalled', () => { inst.hidden = true; how.hidden = false; how.textContent = '✅ Installed - the Limelight Editor icon is on the Desktop'; });
inst.onclick = async () => { if (!ask) return; ask.prompt(); await ask.userChoice.catch(() => null); ask = null; inst.hidden = true; };
document.getElementById('f').onsubmit = async (ev) => {
  ev.preventDefault();
  const e = document.getElementById('e'); e.textContent = '';
  const r = await fetch('/team/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: document.getElementById('n').value, password: document.getElementById('p').value }) }).catch(() => null);
  if (!r) { e.textContent = 'Cannot reach the editing computer'; return; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { e.textContent = j.error || 'Could not sign in'; return; }
  // (a project link - #/p/<name> - opens that project after signing in). On that same address already, going "there"
  // only changes the #, which loads nothing - the sign-in page stayed until a refresh. So: load the page again.
  if (location.pathname === '/') location.reload(); else location.href = `/${location.hash}`;
};
</script>
</body>
</html>
