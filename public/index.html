<!doctype html>
<html lang="en" data-look="limelight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Limelight</title>
<link rel="icon" type="image/png" href="/img/favicon.png?v=4">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#050505">
<link rel="preload" href="/css/fonts/HelveticaNowText-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/css/fonts/HelveticaNowText-Medium.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/ui2.css">
<link rel="stylesheet" href="/css/limelight.css">
<link rel="stylesheet" href="/css/vfx.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/home.css">
</head>
<body>
<!-- 🚀 while the app starts: only the logo's yellow arrow, drifting down the whole screen like a falling leaf; once the projects are on
     screen it flies to the arrow of the Limelight logo on Home and merges into it (on the edit page it just fades). Once
     per window: the project tabs' frames (?tab=) show none of their own. index.html only - no CSS file needed. -->
<style>
#boot { position: fixed; inset: 0; z-index: 99999; background: #050505; transition: background-color .45s ease; perspective: 900px; }
#boot.out { background-color: transparent; pointer-events: none; }
#boot .bt-arrow { position: fixed; left: calc(50% - 26px); top: calc(50% - 26px); width: 52px; height: 52px; overflow: visible; fill: #fbd400; transform-origin: 50% 50%;
  filter: drop-shadow(0 0 14px #fbd400aa); animation: bt-leaf 3.6s ease-in-out infinite;
  transition: left .55s cubic-bezier(.5, 0, .15, 1), top .55s cubic-bezier(.5, 0, .15, 1), width .55s cubic-bezier(.5, 0, .15, 1), height .55s cubic-bezier(.5, 0, .15, 1), filter .5s, opacity .25s; }
/* two faint echoes drift a moment behind, like the leaf's trail */
#boot .bt-arrow.bt-echo { filter: blur(1px) opacity(.3); animation-delay: -.18s; transition: opacity .2s; }
#boot .bt-arrow.bt-echo + .bt-echo { filter: blur(2px) opacity(.14); animation-delay: -.36s; }
#boot.out .bt-arrow { filter: none; } #boot.out .bt-echo { opacity: 0 !important; }
#boot.gone .bt-arrow { opacity: 0; }
/* a leaf falling: in at the top, swaying across the whole screen from side to side as it drifts down, tilting and
   turning over (0deg = the arrow's own up-right); each sway eases in and out */
@keyframes bt-leaf { 0% { opacity: 0; transform: translate(-28vw, -56vh) rotate(-30deg) rotateY(0deg); } 8% { opacity: 1; }
  25% { transform: translate(32vw, -30vh) rotate(38deg) rotateY(55deg); } 50% { transform: translate(-32vw, -3vh) rotate(-38deg) rotateY(-55deg); }
  75% { transform: translate(32vw, 25vh) rotate(38deg) rotateY(55deg); } 92% { opacity: 1; } 100% { opacity: 0; transform: translate(-18vw, 58vh) rotate(-20deg) rotateY(0deg); } }
@media (prefers-reduced-motion: reduce) { #boot .bt-arrow { animation: none; transition: opacity .3s; } #boot .bt-echo { display: none; } }
</style>
<div id="boot" role="status" aria-label="Limelight is starting"><svg class="bt-arrow bt-echo" viewBox="0 0 100 100" aria-hidden="true"><path d="M11 39 L86 8 Q96 5 94 15 L73 90 Q69 99 62 92 Q51 69 13 51 Q4 46 11 39 Z"/></svg><svg class="bt-arrow bt-echo" viewBox="0 0 100 100" aria-hidden="true"><path d="M11 39 L86 8 Q96 5 94 15 L73 90 Q69 99 62 92 Q51 69 13 51 Q4 46 11 39 Z"/></svg><svg class="bt-arrow" viewBox="0 0 100 100" aria-hidden="true"><path d="M11 39 L86 8 Q96 5 94 15 L73 90 Q69 99 62 92 Q51 69 13 51 Q4 46 11 39 Z"/></svg></div>
<script>
(() => { const b = document.getElementById('boot'), t0 = Date.now();
  if (window.top !== window) { b.remove(); return; } // (a project tab's frame: the window around it already showed it)
  // this page and the frame on screen (the project tabs put Home / the edit in a frame)
  const docs = () => { const out = [[document, 0, 0]]; for (const f of document.querySelectorAll('iframe')) { try { const r = f.getBoundingClientRect(); if (r.width && f.contentDocument) out.push([f.contentDocument, r.left, r.top]); } catch {} } return out; };
  const find = (sel) => { for (const [d, x, y] of docs()) { const e = d.querySelector(sel); if (e && e.getClientRects().length) return [e, x, y]; } return null; };
  const done = (fly) => {
    b.classList.add('out');
    const a = b.querySelector('.bt-arrow:not(.bt-echo)'), logo = fly && find('.hm-brand .hb-logo');
    // (from wherever it is on its way down: hold it there, then fly)
    const c = a.getBoundingClientRect();
    Object.assign(a.style, { animation: 'none', transition: 'none', left: `${c.left + c.width / 2 - 26}px`, top: `${c.top + c.height / 2 - 26}px` });
    a.getBoundingClientRect(); a.style.transition = '';
    if (logo && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      // the arrow in the logo picture sits at 95% across, 46.6% down, 5% of its width wide (a 4:1 picture)
      const r = logo[0].getBoundingClientRect(), s = r.width * 0.05;
      Object.assign(a.style, { left: `${logo[1] + r.left + r.width * 0.95}px`, top: `${logo[2] + r.top + r.height * 0.466}px`, width: `${s}px`, height: `${s}px` });
      setTimeout(() => b.classList.add('gone'), 520);
    } else b.classList.add('gone');
    setTimeout(() => b.remove(), 850);
  };
  // (it goes once the projects page or the edit is there - after at least half a second, at most 12 s)
  const tick = () => { if (!b.isConnected) return; const t = Date.now() - t0;
    const home = find('#home .hm-card, #home .hm-row, #home .hm-empty, #home .err'), edit = find('#editor:not([hidden]) .menubar');
    if ((home || edit) && t > 500) done(!!home); else if (t > 12000) done(false); else setTimeout(tick, 100); };
  setTimeout(tick, 100); })();
</script>
<div id="app"></div>
<script type="module">
// 🗂 the window itself is the strip of project tabs (tabs.js) - each tab is an editor (main.js) in a frame. A phone /
// tablet, an editor already in a tab, or ?notabs=1 runs the editor straight in the page as before.
import { deviceMode } from '/js/phonecore.js';
const q = new URLSearchParams(location.search);
let pick = q.get('ui') || ''; try { pick ||= localStorage.getItem('ve-device') || ''; } catch {}
const tabs = window.top === window && !q.has('tab') && !q.has('notabs') && deviceMode({ w: innerWidth, h: innerHeight, coarse: matchMedia('(pointer: coarse)').matches, pick }) === 'desktop';
import(tabs ? '/js/tabs.js' : '/js/main.js');
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>
</body>
</html>
