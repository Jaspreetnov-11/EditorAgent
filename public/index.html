<!doctype html>
<html lang="en" data-look="limelight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Limelight</title>
<link rel="icon" type="image/png" href="/img/favicon.png?v=4">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#050505">
<link rel="preload" href="/css/fonts/HelveticaNowText-Regular.otf" as="font" type="font/otf" crossorigin>
<link rel="preload" href="/css/fonts/HelveticaNowText-Medium.otf" as="font" type="font/otf" crossorigin>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/ui2.css">
<link rel="stylesheet" href="/css/limelight.css">
<link rel="stylesheet" href="/css/vfx.css">
<link rel="stylesheet" href="/css/mobile.css">
<link rel="stylesheet" href="/css/home.css">
</head>
<body>
<!-- 🚀 while the app starts: the Limelight word draws in and its yellow arrow flies in on a curve and lands in its place
     in the logo, then nudges forward until the projects / the edit are on screen (index.html only - no CSS file needed) -->
<style>
#boot { position: fixed; inset: 0; z-index: 99999; display: grid; place-items: center; background: #050505; transition: opacity .4s ease; }
#boot.out { opacity: 0; pointer-events: none; }
#boot .bt-logo { position: relative; width: min(300px, 62vw); aspect-ratio: 4 / 1; }
#boot .bt-logo img { width: 100%; height: 100%; display: block; clip-path: inset(0 100% 0 0); animation: bt-word .75s cubic-bezier(.6, 0, .2, 1) .15s forwards; }
#boot .bt-arrow { position: absolute; left: 95%; top: 46.6%; width: 5%; height: 20%; overflow: visible; fill: #fbd400; opacity: 0; transform-origin: 40% 55%;
  animation: bt-fly .95s cubic-bezier(.25, .8, .25, 1.15) .55s forwards, bt-nudge 1.1s ease-in-out 1.6s infinite; filter: drop-shadow(0 0 6px #fbd40088); }
#boot .bt-bar { position: absolute; left: 0; right: 6%; bottom: -18px; height: 2px; border-radius: 2px; background: #ffffff14; overflow: hidden; }
#boot .bt-bar i { position: absolute; inset: 0 auto 0 0; width: 30%; background: #fbd400; border-radius: 2px; animation: bt-run 1.2s ease-in-out infinite; }
@keyframes bt-word { to { clip-path: inset(0 6% 0 0); } }
@keyframes bt-fly { 0% { opacity: 0; transform: translate(-1500%, 260%) rotate(-160deg) scale(2.6); } 25% { opacity: 1; }
  70% { transform: translate(35%, -35%) rotate(8deg) scale(1.2); } 85% { transform: translate(-6%, 6%) scale(.92); } 100% { opacity: 1; transform: none; } }
@keyframes bt-nudge { 0%, 100% { transform: none; } 45% { transform: translate(22%, -22%); } }
@keyframes bt-run { 0% { left: -30%; } 100% { left: 100%; } }
@media (prefers-reduced-motion: reduce) { #boot .bt-logo img { animation: none; clip-path: inset(0 6% 0 0); } #boot .bt-arrow { animation: none; opacity: 1; } #boot .bt-bar i { animation: none; } }
</style>
<div id="boot" role="status" aria-label="Limelight is starting"><div class="bt-logo"><img src="/img/limelight-logo-white.png" alt="limelight"><svg class="bt-arrow" viewBox="0 0 100 100" aria-hidden="true"><path d="M11 39 L86 8 Q96 5 94 15 L73 90 Q69 99 62 92 Q51 69 13 51 Q4 46 11 39 Z"/></svg><div class="bt-bar"><i></i></div></div></div>
<script>
// (it goes once the projects page or the edit is there - shown at least long enough for the arrow to land, at most 12 s)
(() => { const b = document.getElementById('boot'), t0 = Date.now();
  const ready = () => document.querySelector('#home .hm-card, #home .hm-row, #home .hm-empty, #home .pf-chip, #home .err, #editor:not([hidden]) .menubar');
  const tick = () => { if (!b.isConnected) return; const t = Date.now() - t0; if ((ready() && t > 1500) || t > 12000) { b.classList.add('out'); setTimeout(() => b.remove(), 450); } else setTimeout(tick, 120); };
  setTimeout(tick, 120); })();
</script>
<div id="app"></div>
<script type="module">
// 🗂 the window itself is the strip of project tabs (tabs.js) - each tab is an editor (main.js) in a frame. A phone /
// tablet, an editor already in a tab, or ?notabs=1 runs the editor straight in the page as before.
import { deviceMode } from '/js/phonecore.js';
const q = new URLSearchParams(location.search);
let pick = q.get('ui') || ''; try { pick ||= localStorage.getItem('ve-device') || ''; } catch {}
const tabs = window.top === window && !q.has('tab') && !q.has('notabs') && deviceMode({ w: innerWidth, h: innerHeight, coarse: matchMedia('(pointer: coarse)').matches, pick }) === 'desktop';
import(tabs ? '/js/tabs.js' : '/js/main.js');
</script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});</script>
</body>
</html>
