<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="/img/favicon.png?v=4">
<title>Limelight Review</title>
<link rel="stylesheet" href="/review/_/client.css">
</head>
<body>
<header class="top"><img class="logo" src="/img/limelight-wordmark-white.png" alt="limelight"><h1 id="title">Review</h1><span class="grow"></span><span id="status" class="pill" hidden></span></header>

<section id="gate" class="card gate" hidden>
  <h2>This review needs a password</h2>
  <form id="gateForm"><input id="gatePw" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password"><button type="submit">Open</button></form>
  <p id="gateMsg" class="err"></p>
</section>

<section id="gone" class="card" hidden><h2 id="goneMsg"></h2></section>

<main id="app" hidden>
  <nav id="versions" class="versions" aria-label="Versions"></nav>
  <div class="stage">
    <video id="vid" controls playsinline preload="metadata"></video>
    <svg id="ink" class="ink" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"></svg>
  </div>
  <div id="bar" class="bar" title="Click to go there - dots are comments"><div id="barFill" class="bar-fill"></div></div>

  <section id="fixed" class="card fixed" hidden>
    <h2 id="fixedH">What changed</h2>
    <ul id="fixedList" class="fixed-list"></ul>
  </section>

  <div class="card add">
    <div class="row"><input id="name" maxlength="60" placeholder="Your name" aria-label="Your name" autocomplete="name"></div>
    <textarea id="text" rows="2" maxlength="2000" placeholder="Comment at this moment… (press C)" aria-label="Comment"></textarea>
    <div class="row"><span id="at" class="tc"></span><button id="draw" class="ghost" type="button" title="Draw on the picture to show what you mean">Draw</button><span class="grow"></span><button id="send" type="button">Comment</button></div>
    <p id="msg" class="msg"></p>
  </div>

  <div class="card decide">
    <div id="decided" class="muted"></div>
    <textarea id="dtext" rows="2" maxlength="2000" placeholder="Anything to add? (optional)" aria-label="Message with your decision"></textarea>
    <div class="row"><button id="changes" class="ghost" type="button">Request changes</button><button id="approve" class="ok" type="button">Approve</button></div>
  </div>

  <section id="rate" class="card rate" hidden>
    <h2 id="rateH">How was working with us on this?</h2>
    <div id="stars" class="stars" role="radiogroup" aria-label="Rating, 1 to 5 stars"></div>
    <textarea id="rtext" rows="2" maxlength="500" placeholder="Anything we should do better next time? (optional)" aria-label="Your feedback"></textarea>
    <div class="row"><span id="rdone" class="muted small grow"></span><button id="rsend" type="button">Send feedback</button></div>
  </section>

  <h2 class="h">Comments <span id="count" class="muted"></span></h2>
  <ul id="list" class="list"></ul>
  <p class="muted small foot">Keys: <b>Space</b> play / pause · <b>C</b> comment here · <b>←</b> <b>→</b> 1 second · comments go straight to the editor.</p>
</main>
<script type="module" src="/review/_/client.js"></script>
</body>
</html>
